name: CI

on:
  push:
    branches: [main, ss6]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per supported Silverstripe major, at the oldest and newest PHP that major is
          # used with here. The module's composer.json is the source of truth for the supported
          # range; this matrix must follow it. queuedjobs 6 itself requires PHP 8.3, so that is
          # the SS6 floor.
          - silverstripe: '5'
            php: '8.1'
            framework: '^5.4'
            queuedjobs: '^5'
            testing: '^3'
          - silverstripe: '5'
            php: '8.3'
            framework: '^5.4'
            queuedjobs: '^5'
            testing: '^3'
          - silverstripe: '6'
            php: '8.3'
            framework: '^6'
            queuedjobs: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machine and the
        # Forge servers, so a version-specific failure here means something real.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
      SS_DATABASE_NAME: ss_ci
      SS_ENVIRONMENT_TYPE: dev

    steps:
      - name: Check out the module
        uses: actions/checkout@v7
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app.
        # The module is required through a PATH repository pointing at the checkout, and
        # symlinked rather than mirrored so the tests come along even if /tests is ever made
        # export-ignore. No CMS recipe: queuedjobs only needs framework + admin, which it pulls in.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/framework": "${{ matrix.framework }}",
              "symbiote/silverstripe-queuedjobs": "${{ matrix.queuedjobs }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "restruct/silverstripe-queuedjobs-enhancements": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\QueuedJobsEnhancements\\\\Tests\\\\": "vendor/restruct/silverstripe-queuedjobs-enhancements/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          # Silverstripe 5 is in security-fixes-only until its April 2027 EOL, and every
          # release of it is covered by advisory PKSA-pjvm-vnw2-n3m2 (range <6.2.1),
          # which will not be patched there. Composer therefore refuses to install it
          # under the default policy.
          # Blocking is disabled HERE ONLY, in a throwaway CI host project.
          composer config policy.advisories.block false
          composer update --no-interaction --no-progress
          # composer show takes one package (plus an optional version), so list the resolved versions one by one.
          for p in silverstripe/framework symbiote/silverstripe-queuedjobs phpunit/phpunit; do composer show "$p" | grep -E '^(name|versions)'; done

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Warning-to-error escalation is the RUNNER's behaviour and differs by PHPUnit
               major: 9 (SS5) converts warnings by default, 11 (SS6) has no such attribute.
               failOnWarning is pinned so a warning behaves identically on every leg. -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true">
              <testsuites>
                  <testsuite name="queuedjobs-enhancements">
                      <directory>vendor/restruct/silverstripe-queuedjobs-enhancements/tests</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Run tests
        working-directory: app-host
        # Every run flushes the manifest, and how differs per major:
        # - SS5 (framework 5, PHPUnit 9): SS_PHPUNIT_FLUSH does not exist in framework 5, so it
        #   would be inert. The flush is a trailing `flush=1` argument, which only works AFTER an
        #   explicit test path - `--testsuite x flush=1` makes PHPUnit 9 open "flush=1" as a file
        #   and fail. So the SS5 legs run by path; phpunit.xml still supplies bootstrap and
        #   failOnWarning.
        # - SS6 (framework 6, PHPUnit 11): a `flush=1` argument no longer works; framework 6 reads
        #   SS_PHPUNIT_FLUSH instead, which also combines with --testsuite.
        run: |
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            vendor/bin/phpunit vendor/restruct/silverstripe-queuedjobs-enhancements/tests flush=1
          else
            SS_PHPUNIT_FLUSH=1 vendor/bin/phpunit --testsuite queuedjobs-enhancements
          fi

      - name: Boot the app, build the database, run the module's tasks and the worker
        # The suite proves the classes behave; this proves the module does not break a real
        # boot. Before SS6 support, both BuildTasks were a class-load fatal on SS6 that took the
        # whole application down on flush - no unit test can see that from inside a booted run.
        working-directory: app-host
        run: |
          if [ "${{ matrix.silverstripe }}" = "5" ]; then
            php vendor/silverstripe/framework/cli-script.php dev/build flush=1
            php vendor/silverstripe/framework/cli-script.php dev/tasks/check-default-jobs
            php vendor/silverstripe/framework/cli-script.php dev/tasks/cleanup-broken-jobs
            # The worker and its restart signal, run for real once: an empty queue must make the
            # worker exit 0 straight away. `timeout` turns a worker that never stops into a red
            # leg instead of a job that hangs until GitHub's 6-hour limit.
            php vendor/silverstripe/framework/cli-script.php dev/tasks/QueuedJobsRestartTask
            timeout 120 php vendor/silverstripe/framework/cli-script.php dev/tasks/QueuedJobsWorkTask stop-when-empty=1
          else
            vendor/bin/sake db:build --flush
            vendor/bin/sake tasks:check-default-jobs
            vendor/bin/sake tasks:cleanup-broken-jobs
            # Same worker smoke run as on SS5 above.
            vendor/bin/sake queuedjobs:restart
            timeout 120 vendor/bin/sake queuedjobs:work --stop-when-empty
          fi

  shell:
    # bin/qje-drain.sh against a fake runner: no PHP or database. ubuntu-latest has util-linux
    # flock and perl, so both lock variants run here (macOS dev machines only have perl).
    name: Drain wrapper (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wrapper tests
        run: bash tests/shell/qje-drain-test.sh
      - name: Must-fail controls (each broken copy of the wrapper must fail the tests)
        run: bash tests/shell/qje-drain-test.sh --mutants

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor of the module's php constraint (SS5) and the SS6 floor.
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
