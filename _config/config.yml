---
Name: queuedjobs-enhancements
After:
  - '#queuedjobsettings'
---
# ImmediateJobRunner: set true if inotifywait is running (uses IMMEDIATE queue instead of CLI spawn)
#
# NOTE: this also requires QueuedJobService.use_shutdown_function: false, otherwise no
# trigger file is written and nothing can pick the job up sub-second. See the README.
Restruct\QueuedJobsEnhancements\Services\ImmediateJobRunner:
  use_immediate_queue: false

# Self-declaring default jobs ($is_default_job = true) are DIAGNOSTIC ONLY — this module
# does not create or schedule them. Core already does that: QueuedJobService::runQueue()
# calls checkDefaultJobs() on every ProcessJobQueueTask run. Use
# `sake dev/tasks/check-default-jobs yaml=1` to emit the core `defaultJobs` block to paste.
