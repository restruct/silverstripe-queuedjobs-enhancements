---
Name: queuedjobs-enhancements
After:
  - '#queuedjobsettings'
---
# Up to 1.6.0 this file set ImmediateJobRunner.use_immediate_queue: false ("set true if inotifywait
# is running (uses IMMEDIATE queue instead of CLI spawn)"). Deprecated by the drain spawn and removed
# in 1.7.0: ImmediateJobRunner::queueAndRun() always queues on the IMMEDIATE queue now, and the
# drain spawn (below) runs it. A site with its own inotifywait watcher sets DrainSpawner.enabled:
# false instead.
#
# NOTE: such a watcher also requires QueuedJobService.use_shutdown_function: false, otherwise no
# trigger file is written and nothing can pick the job up sub-second. See the README.

# Drain spawn: every new IMMEDIATE job descriptor starts bin/qje-drain.sh in the background, which
# runs the immediate queue until it is empty (one runner at a time, behind a lock). See the README,
# "Immediate execution". Tunables (shown with their defaults):
#
# Restruct\QueuedJobsEnhancements\Services\DrainSpawner:
#   enabled: true    # false on a site that runs the immediate queue another way
#   php_cli: ''      # CLI php binary; the QJE_PHP_CLI env var wins over this
#   log_file: ''     # append wrapper/runner output here (relative = under TEMP_PATH)
# Restruct\QueuedJobsEnhancements\Worker\QueueWorker:
#   linger: 2        # seconds a drain runner keeps looking for new jobs before it exits
Symbiote\QueuedJobs\DataObjects\QueuedJobDescriptor:
  extensions:
    - Restruct\QueuedJobsEnhancements\Extensions\QueuedJobDescriptorDrainExtension
    # Record the queued job currently being processed (+ its memory usage) into $_SERVER, so that a
    # fatal inside the queue runner can be attributed to a job and step. Without this an OOM alert
    # says only "GET dev/tasks/ProcessJobQueueTask": the runner, not the job.
    #
    # Hooked on the DESCRIPTOR, not the service: QueuedJobService exposes no extension hooks, but it
    # writes the descriptor after every processed step, so onAfterWrite() is called exactly as often
    # as the job progresses, for every job, using only supported APIs.
    #
    # The keys (QUEUED_JOB, QUEUED_JOB_MEMORY) are rendered by restruct/silverstripe-admintweaks'
    # EnhancedErrorFormatter (they are in its default `server_vars`). Moved here from admintweaks
    # in 1.7.0; admintweaks no longer registers its own copy when this class exists.
    - Restruct\QueuedJobsEnhancements\Extensions\QueuedJobContextExtension
    # canView() for the member the job runs as (RunAsID), on top of upstream's ADMIN-only default.
    # Used by JobProgressController; structural, so any other caller of canView() agrees with it.
    - Restruct\QueuedJobsEnhancements\Extensions\QueuedJobDescriptorPermissionExtension
    # Lock refresh ("lease heartbeat"), OFF by default: after each step of a running job, move its
    # Expiry to now + worker_ttl, so the health check restarts a job that made no step for
    # worker_ttl rather than any job running longer than that. Only the process holding the lock
    # refreshes it. Remove when upstream refreshes the lock itself. Switch on with:
    #
    # Restruct\QueuedJobsEnhancements\Extensions\QueuedJobLeaseRefreshExtension:
    #   enabled: true
    #   min_interval: 30   # seconds between two refreshes of the same job
    - Restruct\QueuedJobsEnhancements\Extensions\QueuedJobLeaseRefreshExtension

# Keep ScheduledMethodCall out of upstream's "Create job of type" form in the Jobs admin: its
# constructor takes (class, method) from that form's textarea, which made it a way to call any
# static method. Also refuses a crafted POST (the dropdown is validated against its source). More
# classes: QueuedJobsAdminJobTypesExtension.hidden_job_types.
Symbiote\QueuedJobs\Controllers\QueuedJobsAdmin:
  extensions:
    - Restruct\QueuedJobsEnhancements\Extensions\QueuedJobsAdminJobTypesExtension

# Self-declaring default jobs ($is_default_job = true) are DIAGNOSTIC ONLY — this module
# does not create or schedule them. Core already does that: QueuedJobService::runQueue()
# calls checkDefaultJobs() on every ProcessJobQueueTask run. Use
# `sake dev/tasks/check-default-jobs yaml=1` (SS5) or `sake tasks:check-default-jobs --yaml`
# (SS6) to emit the core `defaultJobs` block to paste.

# Concurrency guard (OPT-IN, per project): swap the queued-jobs service for the module's
# subclass to enforce `private static bool $prevent_concurrent_runs = true` on job classes
# (a second descriptor of such a job gets DEFERRED while one is active, closing the
# cross-process duplicate-writes window). The module deliberately does NOT register this
# swap — enable it in YOUR project config:
#
# SilverStripe\Core\Injector\Injector:
#   Symbiote\QueuedJobs\Services\QueuedJobService:
#     class: Restruct\QueuedJobsEnhancements\Services\EnhancedQueuedJobService
#
# Already running your own QueuedJobService subclass? Add `use ConcurrencyGuardedMutex;`
# to it instead of swapping. Tunables (defer_seconds) live on ConcurrencyGuard:
#
# Restruct\QueuedJobsEnhancements\Services\ConcurrencyGuard:
#   defer_seconds: 300
